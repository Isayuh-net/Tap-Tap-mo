<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Tap-Tap Mo</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="img/logo.png">
</head>
<body class="login-page">
  <form id="login" class="panel login-box">
    <div class="login-strip"></div>
    <div class="brand">
      <img src="img/logo.png" alt="">
      <div>
        <div class="brand-name">Baguio City National High School</div>
        <div class="brand-sub">Tap-Tap Mo attendance</div>
      </div>
    </div>
    <h1>Staff login</h1>
    <p class="subtitle">Log in to see attendance and send parent texts.</p>
    <p id="message" class="message" role="alert"></p>
    <label>Username <input id="username" autocomplete="username" required autofocus></label>
    <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
    <button type="submit" class="primary">Log in</button>
  </form>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
