<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- img-src data: lets the screen show student photos, which main.js sends as data: addresses -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Tap-Tap Mo Gate</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- One screen, restyled for each state in Figure 3: waiting, ok, warn, offline, error -->
  <div id="screen" class="waiting">
    <!-- The school's background design. It keeps its shape on any screen, so the photo
         always lands inside the box drawn on it. -->
    <div id="stage">
      <div id="photo-frame">
        <img id="photo" alt="" hidden>
        <!-- Shown when there is no photo; which part shows depends on the state (see styles.css) -->
        <div id="photo-empty">
          <div class="when-waiting">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 7.5a6 6 0 0 1 0 9M12 5a9.5 9.5 0 0 1 0 14M15.5 2.5a13 13 0 0 1 0 19M5 10a2.5 2.5 0 0 1 0 4"/></svg>
            <span>Tap your ID card</span>
          </div>
          <div class="when-no-photo">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4.5"/><path d="M3.5 21.5c0-4.7 3.8-8 8.5-8s8.5 3.3 8.5 8"/></svg>
          </div>
          <div class="when-unknown">?</div>
        </div>
      </div>

      <div id="panel">
        <div id="info">
          <div id="banner"></div>
          <div id="clock"></div>
          <div id="label"></div>
          <div id="name">Tap your card</div>
          <div id="strand"></div>
          <div id="detail"></div>
          <div id="note"></div>
        </div>

        <!-- The USB reader "types" the card number into this box and presses Enter.
             A student without their ID card types their LRN into the same box. -->
        <div id="lrn-entry">
          <label for="scan">No ID card? Type your 12-digit LRN, then press Enter</label>
          <input id="scan" autocomplete="off" inputmode="numeric" placeholder="LRN" autofocus>
        </div>
      </div>
    </div>
  </div>

  <script src="gate.js"></script>
</body>
</html>
